; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
name = PolyConLab
description = Test ESP32 Dev

[env]
check_tool = clangtidy
check_flags = --enable=warning,performance,portability
lib_deps = arduino-libraries/Ethernet@^2.0.2

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

[env:esp32plc_38ar]
platform_packages =
	framework-industrialshields-esp32@https://apps.industrialshields.com/main/arduino/boards/industrialshields-boards-esp32-2.5.2.tar.bz2
platform = https://github.com/Industrial-Shields/platform-industrialshields-esp32.git
framework = arduino
board = esp32plc_38ar
custom_version = 3
custom_click1 = None
custom_click2 = None
monitor_speed = 115200

[env:esp32plc_19r]
platform_packages =
	framework-industrialshields-esp32@https://apps.industrialshields.com/main/arduino/boards/industrialshields-boards-esp32-2.5.2.tar.bz2
platform = https://github.com/Industrial-Shields/platform-industrialshields-esp32.git
framework = arduino
board = esp32plc_19r
custom_version = 3
custom_click1 = None
custom_click2 = None
monitor_speed = 115200
