; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
name = PolyConLab_FW
description = Project for PolyConLab Firmware Development

[env]
test_framework = doctest
lib_deps =
	doctest/doctest@2.4.11
	adafruit/Adafruit MCP9600 Library@^2.0.4
	adafruit/Adafruit BusIO@^1.14.1
check_tool = clangtidy
check_flags =
	clangtidy: --enable=warning,performance,portability
monitor_dtr = 0
monitor_rts = 0
build_flags =
	-Wall
	-Werror
	-std=c++11
	-DCONFIG_FREERTOS_MAX_PRIORITIES=10

[env:esp32_module]
build_type = release
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

[env:plc_38ar]
platform = https://github.com/Industrial-Shields/platform-industrialshields-esp32.git@1.1.0
platform_packages = framework-industrialshields-esp32@https://apps.industrialshields.com/main/arduino/boards/industrialshields-boards-esp32-2.7.0.tar.bz2
build_flags = ${env.build_flags} -DPLC_38AR
framework = arduino
board = esp32plc_38ar
custom_version = 3
custom_click1 = None
custom_click2 = None
monitor_speed = 115200

[env:plc_19r]
platform = https://github.com/Industrial-Shields/platform-industrialshields-esp32.git@1.1.0
platform_packages = framework-industrialshields-esp32@https://apps.industrialshields.com/main/arduino/boards/industrialshields-boards-esp32-2.7.0.tar.bz2
build_type = release
build_flags = ${env.build_flags} -DPLC_19R
board = esp32plc_19r
framework = arduino
custom_version = 3
custom_click1 = None
custom_click2 = None
